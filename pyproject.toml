[project]
name = "dokkan"
version = "0.1.0"
description = "Single-account Dokkan helper organised as concentric rings."
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
dokkan = "dokkan.cli.main:main"
dokkan-gui = "dokkan.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
